<div class="dashboard-shell bg-light min-vh-100">
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Dashboard</span>
      <button class="btn btn-outline-light" (click)="logout()">Sign Out</button>
    </div>
  </nav>

  <main class="container py-4">
    <section class="mb-4">
      <h2 class="h4 mb-3">Overview</h2>
      <div class="row">
        <div class="col-12 col-md-6 mb-3">
          <div class="card h-100 shadow-sm">
            <div class="card-header">Card Title</div>
            <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 220px;">
              <canvas baseChart
                [data]="donutData"
                [options]="donutOptions"
                [type]="'doughnut'">
              </canvas>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <div class="card h-100 shadow-sm">
            <div class="card-header">Card Title</div>
            <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 220px;">
              <canvas baseChart
                [data]="barData"
                [options]="barOptions"
                [type]="'bar'">
              </canvas>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section *ngIf="!loading && dashboardData; else loadingState">
      <h2 class="h4 mb-3">User List</h2>
      <div class="card shadow-sm">
        <div class="table-responsive">
          <table class="table mb-0">
            <thead class="thead-light">
              <tr>
                <th>#</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>User Name</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let user of dashboardData.tableUsers; index as i">
                <td>{{ i + 1 }}</td>
                <td>{{ user.firstName }}</td>
                <td>{{ user.lastName }}</td>
                <td>{{ user.username }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <ng-template #loadingState>
      <div class="alert alert-secondary text-center">{{ loading ? 'Loading dashboard...' : 'Unable to load dashboard data.' }}</div>
    </ng-template>
  </main>
</div>
