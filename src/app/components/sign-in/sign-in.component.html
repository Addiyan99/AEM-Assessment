<div class="signin-shell d-flex align-items-center min-vh-100 bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="card-title text-center mb-4">Sign in to your dashboard</h2>

            <form [formGroup]="form" (ngSubmit)="submit()">
              <div class="form-group mb-3">
                <label class="sr-only" for="emailInput">Email</label>
                <input id="emailInput" type="email" class="form-control" formControlName="email" placeholder="Username" />
                <small class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">Email is required.</small>
                <small class="text-danger" *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">Please enter a valid email.</small>
              </div>

              <div class="form-group mb-4">
                <label class="sr-only" for="passwordInput">Password</label>
                <input id="passwordInput" type="password" class="form-control" formControlName="password" placeholder="Password" />
                <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('required')">Password is required.</small>
                <small class="text-danger" *ngIf="form.get('password')?.touched && form.get('password')?.hasError('minlength')">Minimum 6 characters.</small>
              </div>

              <button type="submit" class="btn btn-primary btn-block" [disabled]="isSubmitting">
                {{ isSubmitting ? 'Signing in...' : 'SIGN IN' }}
              </button>

              <p class="text-danger text-center mt-3" *ngIf="errorMessage">{{ errorMessage }}</p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
