<div class="dashboard-shell bg-light min-vh-100">
  <app-navbar></app-navbar>

  <main class="container d-flex flex-column py-4 gap-4">
    <section *ngIf="!loading && dashboardData; else loadingState">
      <h2 class="h4 mb-3 text-dark">Overview</h2>
      <div class="row">
        <div class="col-12 col-md-6">
          <div class="card-body card rounded border-1 gap-2 p-0 h-100">
            <h5 class="card-header rounded-top m-0 p-3 border-0 text-dark">Card Title</h5>
            <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 180px;">
              <canvas baseChart
                [data]="donutData"
                [options]="donutOptions"
                [type]="'doughnut'">
              </canvas>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="card-body card rounded border-1 gap-2 p-0 h-100">
            <h5 class="card-header rounded-top m-0 p-3 border-0 text-dark">Card Title</h5>
            <div class="card-body d-flex justify-content-center align-items-center" style="min-height: 220px;">
              <canvas baseChart
                [data]="barData"
                [options]="barOptions"
                [type]="'bar'">
              </canvas>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section *ngIf="!loading && dashboardData; else loadingState">
      <h2 class="h4 mb-3 text-dark">User List</h2>
      <div class="card-body card border-0 gap-2 p-0 h-100">
        <table class="table table-bordered mb-0">
          <thead class="table-light">
            <tr>
              <th class="text-center py-3 fw-bold">#</th>
              <th class="text-center py-3 fw-bold">First Name</th>
              <th class="text-center py-3 fw-bold">Last Name</th>
              <th class="text-center py-3 fw-bold">User Name</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of dashboardData.tableUsers; index as i">
              <td class="text-center py-3 fw-bold">{{ i + 1 }}</td>
              <td class="text-center py-3 fw-bold">{{ user.firstName }}</td>
              <td class="text-center py-3 fw-bold">{{ user.lastName }}</td>
              <td class="text-center py-3 fw-bold">{{ user.username }}</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <ng-template #loadingState>
      <div class="alert alert-secondary text-center">{{ loading ? 'Loading dashboard...' : 'Unable to load dashboard data.' }}</div>
    </ng-template>
  </main>
</div>
